<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Camera</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="home">
    <header>
        <div class="heading">
            <div class="leftside">
                <div class="notif-con">
                    <h2 class="notif-drop">Notifications v</h2>
                    <div class="notifs">
                        <div class="notif-section">
                            <div class="full-notif">
                                <p class="time">1:33p, thurday </p>
                                <p class="notif">someone is on camera</p>
                            </div>
                        </div>
                        <div class="input-number">
                            <p>Add your number to receive text messages too!</p>
                            <div class="add-number">
                                <input type="text" id="number" placeholder="000-000-0000">
                                <button id="submit-number">Submit</button>
                            </div>                            
                        </div>
                    </div>
                </div>
                <h3 class="logout">Log Out</h3>
            </div>
            <h1>The Security Buddy</h1>
            <button class="gallery-button">Gallery</button>
        </div>
    </header>
    <div class="gallery">
        <h2 id="main-gallery-heading">Gallery v</h2>
        <hr>
        <div id="main-gallery" class="gallery-section">
            <div class="picture">
                <img src="sorry2.jpg" alt="">
                <div class="photo-info">
                    <h4 class="camera-name">iphone camera</h4>
                    <p class="date-time">sunday 6pm</p>
                </div>
            </div>
        </div>
    </div>
    <section class="main">
        <div class="buttons-controls">
                <div class="face-rec">
                    <h2>Facial Recogniton</h2>
                    <div class="add-person">
                        <button id="add-person">Add A Person</button>
                    </div>
                </div>
                <h3>Cameras</h3>
                <button class="add-camera" id="add-cam">Add a Camera</button>
                <div class="input"></div>
                <div class="camera-buttons"></div>
                <div class="delete-button-div">
                    <button class="delete-camera">Delete Camera</button>
                </div>
            
        </div>
        <div class="video-feed">
            <div class="live-feed-header">
                <p class="frame-showed"></p>
            </div>
                <div class="video"><img id="img" src=""  alt=""></div>
            <div class="video-footer">
                <p class="on-screen"></p>
                <div class="video-buttons">
                    <button id="snap">Snap Picture</button>
                    <button id="black-and-white">Black and White</button>
                </div>
                <p class="message-to-user"></p>
            </div>
        </div>
    </section>
    <script type="module" src="app.js"></script>
</body>
</html>
